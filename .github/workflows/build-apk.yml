name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate course content
        run: python3 tools/validate_content.py 2>&1 | tee ci-validate.log
      - name: Unit tests and APK build (debug + release)
        env:
          EHR_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          EHR_KEYSTORE_PASSWORD: ${{ secrets.EHR_KEYSTORE_PASSWORD }}
          EHR_KEY_ALIAS: ${{ secrets.EHR_KEY_ALIAS }}
          EHR_KEY_PASSWORD: ${{ secrets.EHR_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.EHR_KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee ci-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EthicalHackingRoadmap-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: Publish build results to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp ci-*.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/STATUS
          (grep -E "^e: |error:|FAILED|What went wrong|Caused by" -A4 ci-build.log | head -400) > /tmp/out/errors.txt 2>/dev/null || true
          cd /tmp/out
          git init -q && git checkout -q -b ci-results && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
